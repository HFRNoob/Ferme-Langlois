<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../css/main.css">
        <title>Accueil</title>
    </head>
        <body>
        <!-- ===== HEADER ===== -->
        <div class="header" id="top">
                <div class="header_logo">
                    <img src="../assets/images/logo_langlois.png" alt="logo Ferme Langlois">
                </div>
                <div class="header_buttons">
                    <button class="header_accueil header_all" onclick="location.href='../html/index.html'">
                        <p>Accueil</p>
                    </button>
                    <button class="header_produit header_all" onclick="location.href='../html/products.html'">
                        <p>Produits</p>
                    </button>
                    <button class="header_a_propos header_all" onclick="location.href='../html/quisommenous.html'">
                        <p>À propos de nous</p>
                    </button>
                </div>
            </div>
        <!-- ===== CONTENU PAGE ===== -->

        <div class="content-wrapper">
            <img src="../assets/images/accueil_bg.png" alt="background champs" class="bg_image">
            <div class="gradient">
                <img src="../assets/images/gradient_accueil.png" alt="gradient blanc fg" class="gradient_fade">
                <img src="../assets/images/whitebox_accueil.png" alt="white box gradient" class="gradient_box">
            </div>
            <div class="accueil">
                <div class="intro_accueil">
                    <div class="titre_accueil">
                        <p>La Ferme Langlois</p>
                    </div>
                    <div class="separator_accueil">
                        <img src="../assets/images/white_separator.png" alt="white separator">
                    </div>
                    <div class="sous_titre_accueil">
                        <p>Ferme familiale et artisanale depuis maintenant trois générations</p>
                    </div>
                </div>
                <div class="horaires">
                    <div class="titre_horaires">
                        <p>Nos horaires d'ouverture</p>
                    </div>
                    <div class="separator_horaires">
                        <img src="../assets/images/black_separator.png" alt="black separator">
                    </div>
                    <div class="texte_horaires">
                        <div class="horaires_boutique">
                            <p>Horaires de la boutique :<br>
                            En semaine et le samedi : 17h - 19h<br>
                            Dimanche : fermé</p>   
                        </div>
                        <div class="horaires_marche">
                            <p>Horaires des marchés :<br>
                            Mercredi : 9h - 12h30<br>
                            Samedi : 9h - 14h</p>
                        </div>
                    </div>
                    
                </div> 
            </div>
        </div>
        <div class="up_arrow_button">
            <a href="#top">
                <img src="../assets/images/up_arrow.png" alt="up arrow">
            </a>
        </div>
        
        <!-- ===== FOOTER ===== -->
        <div class="footer">
            <div class="footer_buttons">
                <div class="footer_contacter footer_all">
                    <p>Nous contacter</p>
                </div>
                <div class="footer_mentions footer_all">
                    <p>Mentions légales</p>
                </div>
            </div>
        </div>
    </body>
</html>
